<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#faf7f0"/>
  <!-- sol naciente: Laudes es la oración de la aurora -->
  <circle cx="256" cy="330" r="110" fill="#e8a33d"/>
  <g stroke="#e8a33d" stroke-width="26" stroke-linecap="round">
    <line x1="256" y1="132" x2="256" y2="180"/>
    <line x1="118" y1="192" x2="152" y2="226"/>
    <line x1="394" y1="192" x2="360" y2="226"/>
    <line x1="80" y1="330" x2="128" y2="330"/>
    <line x1="432" y1="330" x2="384" y2="330"/>
  </g>
  <!-- horizonte -->
  <rect x="0" y="330" width="512" height="182" fill="#7a5c3e"/>
